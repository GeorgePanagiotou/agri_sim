[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agrisim-ai"
version = "0.3.0"
description = "AgriSim AI: approved Earth observation data and explainable crop-rotation decision support"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13", "pyarrow>=16",
  "requests>=2.31", "certifi>=2024.2", "earthaccess>=0.14", "python-dotenv>=1.0",
  "rasterio>=1.4", "pyproj>=3.6", "affine>=2.4", "shapely>=2.0",
  "xarray>=2024.3", "h5netcdf>=1.3", "netCDF4>=1.6",
  "pystac-client>=0.8", "planetary-computer>=1.0", "truststore>=0.10",
  "ruptures>=1.1.10", "pyyaml>=6.0", "scikit-learn>=1.5",
  "joblib>=1.4"
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "matplotlib>=3.8", "plotly>=5.20"]
ml = ["xgboost>=2.1", "lightgbm>=4.5", "optuna>=4.0"]
notebooks = ["ipykernel>=6.29", "nbformat>=5.10", "matplotlib>=3.8"]
optional-cds = ["cdsapi>=0.7.7"]
# Blackwell RTX 50 (sm_120) support. Explicit PyTorch CUDA-13.0 index below;
# install with: uv sync --extra gpu ; requires compatible NVIDIA driver.
gpu = ["torch==2.14.1", "torchvision==0.29.1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/agrisim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
